name: mlogger-desktop

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/build-desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build MLogger.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the app with bundled Python
        shell: pwsh
        run: ./desktop/build.ps1 -BundlePython
      - name: Check that the bundled Python starts the server
        shell: pwsh
        run: |
          ./dist/MLogger/python/python.exe ./dist/MLogger/app/start.py --help
      - uses: actions/upload-artifact@v4
        with:
          name: MLogger-win-x64
          path: dist/MLogger-win-x64.zip
      - name: Attach the archive to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "MLogger $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME dist/MLogger-win-x64.zip --clobber
