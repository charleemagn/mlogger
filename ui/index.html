<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MLogger</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/css/app.css">
  <script>
    try { const t = localStorage.getItem("mlogger-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>MLogger needs JavaScript to work. / Для работы интерфейса MLogger нужен JavaScript.</noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
